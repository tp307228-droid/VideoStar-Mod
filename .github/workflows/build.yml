name: Build VideoStar-Mod IPA (Pro + FallVds Tool)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid 2>/dev/null || true

      - name: Setup iOS SDK
        run: |
          set -e
          mkdir -p $HOME/theos/sdks
          XSDK="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          SDK=$(ls "$XSDK" 2>/dev/null | grep iPhoneOS | head -1)
          if [ -n "$SDK" ]; then
            ln -sf "$XSDK/$SDK" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
          else
            curl -fsSL "https://github.com/theos/sdks/archive/master.tar.gz" | \
              tar -xz --strip-components=1 -C "$HOME/theos/sdks" 2>/dev/null || true
          fi

      - name: Build FallVdsTool.dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make FINALPACKAGE=1 DEBUG=0 -j$(sysctl -n hw.ncpu) 2>&1

      - name: Find FallVdsTool.dylib
        id: dylib
        run: |
          D=$(find .theos/obj -name "FallVdsTool.dylib" 2>/dev/null | head -1)
          [ -z "$D" ] && D=$(find . -name "FallVdsTool.dylib" 2>/dev/null | head -1)
          [ -z "$D" ] && { echo "dylib not found"; find . -name "*.dylib" 2>/dev/null; exit 1; }
          echo "path=$D" >> $GITHUB_OUTPUT
          echo "FallVdsTool.dylib: $D ($(du -sh "$D" | cut -f1))"
          echo "Checking FallVdsTool.dylib dependencies (Must NOT have CydiaSubstrate):"
          otool -L "$D"

      - name: Build insert_dylib
        run: |
          set -e
          git clone --depth=1 https://github.com/Tyilo/insert_dylib.git /tmp/idylib
          xcodebuild -project /tmp/idylib/insert_dylib.xcodeproj \
            -scheme insert_dylib -configuration Release \
            CONFIGURATION_BUILD_DIR=/tmp/idylib/bin -quiet 2>&1 | tail -3
          BIN=$(find /tmp/idylib/bin -name insert_dylib -type f | head -1)
          sudo cp "$BIN" /usr/local/bin/insert_dylib && chmod +x /usr/local/bin/insert_dylib

      - name: Download VideoStar-Pro.ipa
        run: |
          set -e
          echo "Downloading VideoStar-Pro.ipa from Vds-Pro releases..."

          RELEASES=$(curl -sf \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/tp307228-droid/Vds-Pro/releases")

          ASSET_URL=$(echo "$RELEASES" | \
            grep -o '"url": "https://api.github.com/repos/tp307228-droid/Vds-Pro/releases/assets/[^"]*"' | \
            head -1 | sed 's/"url": "//;s/"//')

          # Also try by scanning for name=VideoStar-Pro.ipa
          if [ -z "$ASSET_URL" ]; then
            echo "Trying jq method..."
            ASSET_URL=$(echo "$RELEASES" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); [print(a['url']) for r in d for a in r.get('assets',[]) if a['name']=='VideoStar-Pro.ipa']" 2>/dev/null | head -1)
          fi

          echo "Asset URL: $ASSET_URL"
          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: VideoStar-Pro.ipa asset not found!"
            echo "Available releases:"
            echo "$RELEASES" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r['tag_name'], [a['name'] for a in r.get('assets',[])]) for r in d]" 2>/dev/null
            exit 1
          fi

          curl -fL \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o VideoStar-Pro.ipa --retry 3 --retry-delay 5

          if [ ! -s "VideoStar-Pro.ipa" ]; then
            echo "Downloaded file is empty"
            exit 1
          fi
          echo "Downloaded: $(du -sh VideoStar-Pro.ipa | cut -f1)"

      - name: Extract Pro IPA
        run: |
          set -e
          mkdir -p extracted
          unzip -q VideoStar-Pro.ipa -d extracted
          APP=$(find extracted/Payload -name "*.app" -maxdepth 1 | head -1)
          [ -z "$APP" ] && { echo "No .app"; exit 1; }
          EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BINARY=$APP/$EXEC" >> $GITHUB_ENV

      - name: Inject FallVdsTool.dylib
        run: |
          set -e
          DYLIB="${{ steps.dylib.outputs.path }}"
          cp "$DYLIB" "$APP/FallVdsTool.dylib"

          insert_dylib --strip-codesig --all-yes \
            "@executable_path/FallVdsTool.dylib" "$BINARY" "$BINARY"

          echo "Injected!"
          otool -L "$BINARY" | grep -E "FallVds|VdsPro|executable"

      - name: Repack final IPA
        run: |
          set -e
          cd extracted && zip -qr ../VideoStar-Mod.ipa Payload/ && cd ..
          echo "Final IPA: $(du -sh VideoStar-Mod.ipa | cut -f1)"

      - name: Release VideoStar-Mod.ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-v${{ github.run_number }}
          name: "FallVds Tool v1.0 - VideoStar Pro+Mod (Build ${{ github.run_number }})"
          body: |
            ## FallVds Tool - VideoStar Pro + Mod

            **Tai file nay, ky bang eSign la dung duoc ngay!**

            ### Bao gom:
            - VideoStar Pro - Full unlock, khong watermark
            - Cham Thay Media - Scan lop, chon anh, thay TAT CA lop 1 click
            - Nhap QR Hang Loat - Chon range, nhap code tung doan, inject all
            - Hide of Stream - An tool khoi man hinh quay/chup
            - Nut noi - Keo duoc, snap canh

            ### Beta Key: MinhTienVds
            ### Discord: discord.gg/swaggang

            ### Cach cai:
            1. Tai VideoStar-Mod.ipa
            2. Mo eSign - Import IPA - Sign - Install
            3. Mo VideoStar - nhan nut sao noi tren man hinh
            4. Tab Ban Quyen - nhap key: MinhTienVds
          files: VideoStar-Mod.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
