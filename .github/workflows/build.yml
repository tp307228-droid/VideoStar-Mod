name: 🌟 Build VideoStar Mod (Pro + FallVds Tool)

# ─────────────────────────────────────────────────────────
# Repo: https://github.com/tp307228-droid/VideoStar-Mod
#
# Flow:
#   1. Checkout repo (FallVdsTool source code)
#   2. Setup Theos + iOS SDK
#   3. Build FallVdsTool.dylib
#   4. Download VideoStar-Pro.ipa from Vds-Pro releases
#   5. Inject FallVdsTool.dylib into Pro IPA
#   6. Publish final VideoStar-Mod.ipa
#      → User downloads, signs with eSign, install & use
# ─────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      pro_tag:
        description: 'Tag của Vds-Pro release (mặc định: latest)'
        required: false
        default: 'latest'

jobs:
  build-mod:
    name: Build FallVdsTool + Inject into Pro IPA
    runs-on: macos-14

    steps:
      # ── 1. Checkout ────────────────────────────────────
      - name: 📥 Checkout VideoStar-Mod
        uses: actions/checkout@v4

      # ── 2. Setup Theos ─────────────────────────────────
      - name: ⚙️ Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: 📱 Link iOS SDK
        run: |
          set -e
          mkdir -p $HOME/theos/sdks
          XSDK="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs"
          FOUND_SDK=$(ls "$XSDK" 2>/dev/null | grep "iPhoneOS" | head -1)
          if [ -n "$FOUND_SDK" ]; then
            ln -sf "$XSDK/$FOUND_SDK" "$HOME/theos/sdks/iPhoneOS16.5.sdk"
            echo "✅ SDK: $FOUND_SDK"
          else
            curl -fsSL "https://github.com/theos/sdks/archive/master.tar.gz" | \
              tar -xz --strip-components=1 -C "$HOME/theos/sdks" 2>/dev/null || true
            echo "✅ Downloaded SDK"
          fi
          ls $HOME/theos/sdks/

      # ── 3. Build FallVdsTool.dylib ─────────────────────
      - name: 🔨 Build FallVdsTool.dylib
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"

          echo "📋 Source files:"
          ls FallVdsTool/

          make package FINALPACKAGE=1 DEBUG=0 -j$(sysctl -n hw.ncpu) 2>&1
          echo "✅ Build complete"

      - name: 🔍 Find FallVdsTool.dylib
        id: find_dylib
        run: |
          set -e
          DYLIB=$(find .theos/obj -name "FallVdsTool.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find . -name "FallVdsTool.dylib" 2>/dev/null | head -1)
          fi
          if [ -z "$DYLIB" ]; then
            echo "❌ FallVdsTool.dylib not found!"
            find . -name "*.dylib" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Found: $DYLIB ($(du -sh "$DYLIB" | cut -f1))"
          echo "dylib=$DYLIB" >> $GITHUB_OUTPUT

      # ── 4. Install insert_dylib ────────────────────────
      - name: 🔧 Build insert_dylib
        run: |
          set -e
          git clone --depth=1 https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild \
            -project insert_dylib.xcodeproj \
            -scheme insert_dylib \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=/tmp/insert_dylib/bin \
            -quiet 2>&1 | tail -5
          BINARY=$(find /tmp/insert_dylib/bin -name "insert_dylib" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "❌ insert_dylib build failed"
            exit 1
          fi
          sudo cp "$BINARY" /usr/local/bin/insert_dylib
          chmod +x /usr/local/bin/insert_dylib
          echo "✅ insert_dylib installed"

      # ── 5. Download VideoStar-Pro.ipa from Vds-Pro ─────
      - name: ⬇️ Download VideoStar-Pro.ipa
        run: |
          set -e
          PRO_TAG="${{ github.event.inputs.pro_tag || 'latest' }}"
          REPO="tp307228-droid/Vds-Pro"

          echo "📥 Fetching Pro IPA from $REPO ($PRO_TAG)..."

          # Get release info via GitHub API
          if [ "$PRO_TAG" = "latest" ]; then
            API_URL="https://api.github.com/repos/$REPO/releases/latest"
          else
            API_URL="https://api.github.com/repos/$REPO/releases/tags/$PRO_TAG"
          fi

          RELEASE_JSON=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL") || {
            echo "⚠️ Could not fetch from GitHub API, trying direct download..."
            RELEASE_JSON=""
          }

          if [ -n "$RELEASE_JSON" ]; then
            # Extract download URL for .ipa
            IPA_URL=$(echo "$RELEASE_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assets = data.get('assets', [])
          for a in assets:
              if a['name'].endswith('.ipa'):
                  print(a['browser_download_url'])
                  break
          ")
            echo "🔗 IPA URL: $IPA_URL"
            if [ -n "$IPA_URL" ]; then
              curl -fL \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "$IPA_URL" -o VideoStar-Pro.ipa
              echo "✅ Downloaded: $(du -sh VideoStar-Pro.ipa)"
            fi
          fi

          # Fallback: try latest release download page
          if [ ! -f "VideoStar-Pro.ipa" ] || [ ! -s "VideoStar-Pro.ipa" ]; then
            echo "⚠️ Trying fallback download..."
            curl -fL \
              "https://github.com/$REPO/releases/latest/download/VideoStar-Pro.ipa" \
              -o VideoStar-Pro.ipa \
              --retry 3 \
              --retry-delay 5 || {
                echo "❌ Could not download Pro IPA from $REPO"
                echo "Make sure Vds-Pro workflow ran successfully first!"
                exit 1
              }
          fi

          echo "✅ VideoStar-Pro.ipa ready: $(du -sh VideoStar-Pro.ipa)"

      # ── 6. Extract Pro IPA ─────────────────────────────
      - name: 📦 Extract Pro IPA
        run: |
          set -e
          mkdir -p extracted
          unzip -q VideoStar-Pro.ipa -d extracted
          echo "✅ Extracted"

          APP=$(find extracted/Payload -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "❌ .app not found in Pro IPA"
            ls extracted/Payload/ || true
            exit 1
          fi
          echo "📱 App: $APP"
          echo "APP=$APP" >> $GITHUB_ENV

          EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          BINARY="$APP/$EXEC"
          echo "🔑 Binary: $BINARY"
          echo "BINARY=$BINARY" >> $GITHUB_ENV

          echo "📋 Existing load commands:"
          otool -L "$BINARY" | head -15

      # ── 7. Inject FallVdsTool.dylib ────────────────────
      - name: 💉 Inject FallVdsTool.dylib
        run: |
          set -e
          DYLIB="${{ steps.find_dylib.outputs.dylib }}"
          echo "📋 Injecting: $DYLIB → $APP"

          # Copy dylib into .app bundle
          cp "$DYLIB" "$APP/FallVdsTool.dylib"
          echo "✅ Copied dylib"

          # Also copy substrate/CydiaSubstrate if present
          SUBSTRATE=$(find $HOME/theos -name "CydiaSubstrate" -o -name "libsubstrate.dylib" 2>/dev/null | head -1)
          if [ -n "$SUBSTRATE" ]; then
            cp "$SUBSTRATE" "$APP/CydiaSubstrate" 2>/dev/null || true
            echo "✅ Copied substrate: $SUBSTRATE"
          fi

          # Inject via insert_dylib
          insert_dylib \
            --strip-codesig \
            --all-yes \
            "@executable_path/FallVdsTool.dylib" \
            "$BINARY" \
            "$BINARY"

          echo "✅ Injected FallVdsTool.dylib!"
          echo "📋 Final load commands:"
          otool -L "$BINARY" | grep -E "FallVds|executable|VdsPro"

      # ── 8. Update Info.plist (optional branding) ───────
      - name: 🎨 Brand IPA
        run: |
          set -e
          PLIST="$APP/Info.plist"

          # Add FallVds Tool to display name suffix
          ORIG_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$PLIST" 2>/dev/null || \
                      /usr/libexec/PlistBuddy -c "Print CFBundleName" "$PLIST")
          echo "📋 Original name: $ORIG_NAME"

          # Keep original name, just note it's modded
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleDisplayName '$ORIG_NAME'" "$PLIST" 2>/dev/null || true

          echo "✅ Branding done"

      # ── 9. Repack final IPA ────────────────────────────
      - name: 📦 Repack Final IPA
        run: |
          set -e
          cd extracted
          zip -qr ../VideoStar-Mod.ipa Payload/
          cd ..
          echo "✅ Repacked"
          echo "📦 Final IPA: $(du -sh VideoStar-Mod.ipa)"

      # ── 10. Upload artifact ────────────────────────────
      - name: ⬆️ Upload Mod IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStar-Mod-FallVds
          path: VideoStar-Mod.ipa
          retention-days: 30

      # ── 11. Create GitHub Release ──────────────────────
      - name: 🚀 Release VideoStar-Mod.ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-v${{ github.run_number }}
          name: "🌟 FallVds Tool v1.0 — VideoStar Pro+Mod (Build ${{ github.run_number }})"
          body: |
            ## 🌟 FallVds Tool — VideoStar Pro + Mod

            > **Tải file này, ký bằng eSign là dùng được ngay!**

            ---

            ### ✅ Bao gồm:
            | | Tính năng |
            |---|---|
            | 🔓 | **VideoStar Pro** — Full unlock, không watermark |
            | 🖼️ | **Chạm Thay Media** — Thay toàn bộ lớp ảnh/video 1 click |
            | 📷 | **Nhập QR Hàng Loạt** — Chọn range, nhập code, chọn ảnh → tự inject |
            | 🛡️ | **Hide of Stream** — Ẩn tool khỏi màn hình quay/chụp |
            | ⭐ | **Nút nổi** — Kéo được, snap cạnh, gradient đẹp |
            | 🔑 | **Bản quyền** — Key system + UUID thiết bị |

            ### 📲 Cách cài:
            1. Tải `VideoStar-Mod.ipa` bên dưới
            2. Mở **eSign** → Import IPA → Sign → Install
            3. Mở VideoStar → nhấn nút ⭐ nổi
            4. Tab **Bản Quyền** → nhập key beta: `MinhTienVds`

            ### 🔑 Beta Key:
            ```
            MinhTienVds
            ```

            ### 💬 Discord:
            [discord.gg/swaggang](https://discord.gg/swaggang)

            ---
            **Build:** `${{ github.sha }}`
            **Pro IPA từ:** [Vds-Pro](https://github.com/tp307228-droid/Vds-Pro)
          files: VideoStar-Mod.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
